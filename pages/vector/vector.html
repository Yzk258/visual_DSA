<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Vector Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #007bff;
            --bg: #ffffff;
            --box-border: #333;
            --text: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 30px;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        /* 控制栏 */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60px;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.secondary { background: #6c757d; }

        /* 向量容器 */
        .vector-container {
            display: flex;
            gap: 5px;
            margin: auto;
            min-height: 150px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            position: relative;
        }

        /* 单个元素样式 */
        .element {
            width: 50px;
            height: 50px;
            background: #e7f0ff;
            border: 2px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            position: relative;
            transition: all 0.5s ease;
            animation: fadeIn 0.3s;
        }
        .element.empty {
            background: #f8f9fa;
            border: 2px dashed #ccc;
            color: #ccc;
        }
        .element .index {
            position: absolute;
            bottom: -25px;
            font-size: 12px;
            color: #888;
        }
        .element.active {
            background: #ffeaa7;
            transform: translateY(-10px);
        }

        /* 状态说明 */
        .status-panel {
            margin-top: 40px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            background: #f9f9f9;
            border-left: 5px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="number" id="valInput" placeholder="值" value="10">
        <input type="number" id="idxInput" placeholder="位置" value="0">
        <button onclick="insertAt()">插入 insert()</button>
        <button class="secondary" onclick="removeAt()">删除 remove()</button>
        <button class="secondary" onclick="randomize()">随机生成</button>
    </div>

    <div class="vector-container" id="vector-view">
        </div>

    <div class="status-panel">
        <strong>当前状态：</strong>
        <span id="status-text">就绪。Vector 支持 $O(1)$ 的随机访问。</span>
        <p><small>提示：当 size > capacity 时，Vector 会触发扩容操作（通常是容量翻倍）。</small></p>
    </div>

    <script>
        let data = [12, 45, 78];
        let capacity = 4;

        function render() {
            const container = document.getElementById('vector-view');
            container.innerHTML = '';
            
            for (let i = 0; i < capacity; i++) {
                const div = document.createElement('div');
                div.className = `element ${i >= data.length ? 'empty' : ''}`;
                div.innerHTML = `
                    ${data[i] !== undefined ? data[i] : ''}
                    <span class="index">rank ${i}</span>
                `;
                container.appendChild(div);
            }
            document.getElementById('status-text').innerText = `Size: ${data.length} | Capacity: ${capacity}`;
        }

        function insertAt() {
            const val = parseInt(document.getElementById('valInput').value);
            const idx = parseInt(document.getElementById('idxInput').value);

            if (idx < 0 || idx > data.length) {
                alert("越界了！");
                return;
            }

            // 模拟扩容逻辑
            if (data.length >= capacity) {
                capacity *= 2;
                document.getElementById('status-text').innerText = "触发扩容！Capacity 翻倍...";
            }

            data.splice(idx, 0, val);
            render();
            highlight(idx);
        }

        function removeAt() {
            const idx = parseInt(document.getElementById('idxInput').value);
            if (data.length > 0 && idx < data.length) {
                data.splice(idx, 1);
                render();
            }
        }

        function highlight(idx) {
            const el = document.getElementById('vector-view').children[idx];
            el.classList.add('active');
            setTimeout(() => el.classList.remove('active'), 1000);
        }

        function randomize() {
            data = Array.from({length: 3}, () => Math.floor(Math.random() * 100));
            capacity = 4;
            render();
        }

        // 初始渲染
        render();
    </script>
</body>
</html>
