<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heap Visualizer</title>
    <link rel="stylesheet" href="../theme.css">
    <script src="../theme-bridge.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #be4ab2;
            --bg: var(--theme-page-bg);
        }
        body { font-family: 'Segoe UI', sans-serif;margin: 0; padding: 30px; background: var(--bg); color: var(--theme-text); text-align: center; }
        
        .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; }
        input { padding: 8px; border: 1px solid var(--theme-border); border-radius: 4px; width: 60px; background: var(--theme-surface); color: var(--theme-text); }
        button { padding: 8px 16px; border: none; border-radius: 4px; background: var(--primary); color: white; cursor: pointer; }

        /* 树形显示区域 */
        .tree-visual { display: flex; flex-direction: column; align-items: center; min-height: 250px; margin-bottom: 40px; }
        .level { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .node {
            width: 40px; height: 40px; border: 2px solid var(--primary);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; font-weight: bold; background: var(--theme-surface);
            transition: all 0.5s; position: relative;
        }
        .node.swapping { background: #f1c40f; transform: scale(1.2); }

        /* 数组显示区域 */
        .array-visual {
            display: flex; justify-content: center; gap: 5px; 
            padding: 20px; background: var(--theme-panel-bg); border-radius: 8px;
            overflow-x: auto;
        }
        .cell {
            width: 45px; height: 45px; border: 1px solid #999;
            background: var(--theme-surface); display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-size: 0.9rem;
        }
        .cell .idx { font-size: 10px; color: #888; margin-top: 2px; }
        .cell.active { border: 2px solid var(--primary); background: #fff5e6; }

        .info-card { margin: 40px auto; padding: 20px; background: var(--theme-surface); border-radius: 8px; border-left: 5px solid var(--primary); text-align: left; box-shadow: var(--theme-shadow); }
    </style>
</head>
<body>

    <div class="controls">
        <input type="number" id="valInput" value="50">
        <button onclick="insertHeap()">插入入堆 (Push)</button>
        <button style="background: #7f8c8d;" onclick="resetHeap()">重置</button>
    </div>

    <div class="tree-visual" id="tree-display">
        </div>

    <div class="array-visual" id="array-display">
        </div>

    <div class="info-card">
        <strong>大顶堆 (Max Heap) 笔记：</strong>
        <p id="status-text">任意节点的值均不小于其左右孩子。插入时先放在末尾，随后执行“上滤 (Sift Up)”操作。</p>
    </div>

    <script>
        let heap = [90, 80, 70, 40, 30]; // 初始堆

        function render() {
            renderArray();
            renderTree();
        }

        function renderArray() {
            const container = document.getElementById('array-display');
            container.innerHTML = heap.map((v, i) => `
                <div class="cell" id="cell-${i}">
                    <strong>${v}</strong>
                    <span class="idx">${i}</span>
                </div>
            `).join('');
        }

        function renderTree() {
            const container = document.getElementById('tree-display');
            container.innerHTML = '';
            if (heap.length === 0) return;

            let html = '';
            let levels = Math.floor(Math.log2(heap.length)) + 1;
            
            for (let l = 0; l < levels; l++) {
                html += `<div class="level">`;
                let start = Math.pow(2, l) - 1;
                let end = Math.min(Math.pow(2, l + 1) - 1, heap.length);
                for (let i = start; i < end; i++) {
                    html += `<div class="node" id="node-${i}">${heap[i]}</div>`;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        async function insertHeap() {
            let val = parseInt(document.getElementById('valInput').value);
            heap.push(val);
            render();
            
            // 执行上滤动画
            let i = heap.length - 1;
            while (i > 0) {
                let p = Math.floor((i - 1) / 2);
                document.getElementById(`node-${i}`).classList.add('swapping');
                document.getElementById(`cell-${i}`).classList.add('active');
                
                if (heap[i] <= heap[p]) break;

                await new Promise(r => setTimeout(r, 800)); // 等待动画
                
                // 交换
                [heap[i], heap[p]] = [heap[p], heap[i]];
                render();
                i = p;
            }
            render();
        }

        function resetHeap() { heap = [90, 80]; render(); }
        render();
    </script>
</body>
</html>
