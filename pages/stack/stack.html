<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Visualizer</title>
    <link rel="stylesheet" href="../theme.css">
    <script src="../theme-bridge.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #d65a4a;
            --bg: var(--theme-page-bg);
            --text: var(--theme-text);
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 30px;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center; /* 栈居中显示 */
        }
        
        /* 控制面板 */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }
        input {
            padding: 8px;
            border: 1px solid var(--theme-border);
            border-radius: 4px;
            width: 80px;
            background: var(--theme-surface);
            color: var(--theme-text);
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { opacity: 0.85; }
        button.secondary { background: var(--theme-muted); }

        /* 栈的“桶”状容器 */
        .stack-container {
            width: 150px;
            height: 300px;
            border: 4px solid var(--text);
            border-top: none; /* 顶部开口 */
            border-radius: 0 0 12px 12px;
            display: flex;
            flex-direction: column-reverse; /* 关键：让元素从底部开始堆叠 */
            padding: 10px;
            gap: 5px;
            position: relative;
            background: var(--theme-surface);
            box-shadow: var(--theme-shadow);
        }

        /* 单个栈元素样式 */
        .stack-element {
            width: 100%;
            height: 40px;
            background: #ffeaea;
            border: 2px solid var(--primary);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
            position: relative;
            transition: all 0.3s ease;
            animation: pushIn 0.3s ease-out; /* 入栈动画 */
        }

        /* 栈顶标识 */
        .stack-element:last-child::after {
            content: 'Top →';
            position: absolute;
            left: -80px;
            color: var(--primary);
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* 入栈动画：从上方掉落 */
        @keyframes pushIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 出栈动画：向上飞出（通过 JS 动态添加类名触发） */
        .stack-element.popping {
            animation: popOut 0.3s ease-in forwards;
        }
        @keyframes popOut {
            to { opacity: 0; transform: translateY(-100px) scale(0.8); }
        }

        .info-card {
            margin-top: 40px;
            padding: 20px;
            background: var(--theme-panel-bg);
            border-radius: 8px;
            border-left: 5px solid var(--primary);
            width: 100%;
            margin: 40px auto;
            box-shadow: var(--theme-shadow);
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="number" id="valInput" value="42" placeholder="数值">
        <button onclick="push()">入栈 push()</button>
        <button class="secondary" onclick="pop()">出栈 pop()</button>
        <span style="margin-left: auto;">Size: <span id="size-count">0</span></span>
    </div>

    <div class="stack-container" id="stack-view">
        </div>

    <div class="info-card">
        <strong>算法笔记：</strong>
        <p id="status-text">栈（Stack）是一种 LIFO（后进先出）结构。所有操作仅在“栈顶（Top）”进行。常用于函数调用、括号匹配和表达式求值。</p>
    </div>

    <script>
        let stackData = [10, 20, 30]; // 初始预设一些数据

        function render() {
            const container = document.getElementById('stack-view');
            container.innerHTML = ''; // 清空，重新渲染

            stackData.forEach((val) => {
                const div = document.createElement('div');
                div.className = 'stack-element';
                div.innerText = val;
                container.appendChild(div);
            });
            
            document.getElementById('size-count').innerText = stackData.length;
        }

        function push() {
            const val = document.getElementById('valInput').value;
            stackData.push(val); // 数组末尾即栈顶
            render();
            document.getElementById('status-text').innerText = `元素 ${val} 入栈。Top 指针指向它。`;
        }

        function pop() {
            if (stackData.length === 0) {
                alert("栈空了！不可进行 POP 操作。");
                return;
            }

            const container = document.getElementById('stack-view');
            const lastEl = container.lastChild; // 获取当前的 Top 元素

            // 1. 添加出栈动画类
            lastEl.classList.add('popping');

            // 2. 动画结束后，真正移除数据并重绘
            setTimeout(() => {
                const poppedVal = stackData.pop();
                render();
                document.getElementById('status-text').innerText = `元素 ${poppedVal} 出栈。Top 指针下移。`;
            }, 300); // 300ms 对应 CSS 动画时间
        }

        // 初始渲染
        render();
    </script>
</body>
</html>
